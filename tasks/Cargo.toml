[workspace]
members = ["leetcode-daily", "fetch-daily-info","worker"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lettre = "0.11"
anyhow = "1.0"
chrono = "0.4"
regex = "1"
