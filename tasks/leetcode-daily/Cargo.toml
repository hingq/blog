[package]
name = "leetcode-daily"
version = "0.1.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# HTTP 客户端，用于调用 API
reqwest = { version = "0.12", features = ["json"] }
# 序列化/反序列化工具
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 邮件发送库
lettre = "0.11"
# 错误处理简化工具
anyhow = "1.0"
# 时间处理
chrono = "0.4"
regex="1"
