name: LeetCode Daily Bot (Rust)

permissions:
  contents: write

on:
  schedule:
    - cron: '30 0 * * *' # 每天 UTC 时间 00:30 (北京时间 08:30)
  workflow_dispatch: # 支持手动在 GitHub Actions 页面触发

jobs:
  run-task:
    runs-on: ubuntu-latest
    environment: blog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Cargo 依赖以加快执行速度
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tasks/leetcode-daily/Cargo.toml') }}

      - name: Validate runtime secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY// }" ]; then
            echo "GEMINI_API_KEY secret is missing or empty"
            exit 1
          fi
          echo "GEMINI_API_KEY detected with length ${#GEMINI_API_KEY}"

      - name: Run Crawler & Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_HOST: smtp.gmail.com # 如果你使用 QQ/网易 等邮箱，需要修改此主机地址
        run: |
          cd tasks/leetcode-daily
          cargo run --release

      - name: Restore frontend install cache
        id: frontend-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-frontend-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}

      - name: Install frontend dependencies
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        env:
          YARN_HTTP_PROXY: ""
          YARN_HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        run: yarn install --immutable --immutable-cache

      - name: Commit and Push to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog/*.mdx
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-post leetcode daily solution"
            git push origin HEAD:main
          else
            echo "No changes to commit, solution might already exist."
          fi
      - name: publish mdx
        env:
          YARN_HTTP_PROXY: ""
          YARN_HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        run: yarn run publish:content
